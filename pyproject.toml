[project]
name = "openevalz-eval-do-not-answer-adversarial"
version = "0.1.0"
description = "OpenEvalz packaging of Do-Not-Answer Adversarial (jailbreak variant of Do-Not-Answer)"
license = { text = "BUSL-1.1" }
requires-python = ">=3.10"
dependencies = [
  "inspect-ai==0.3.260",
  "trusted-router-py>=0.7.0",
  "pyyaml>=6",
]

[tool.openevalz]
eval = "do_not_answer_adversarial"
execution_class = "plain"
cost_class = "low"
